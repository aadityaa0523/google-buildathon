name: Nexus B2A CI - Invariants & Conformance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-invariants:
    name: Verify Invariants (A01 - A26)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic httpx pytest mcp google-genai

      - name: Run Pytest Verification Matrix
        run: |
          pytest -v nexus-b2a/tests

      - name: Run Standalone Autonomous Agent Commerce Simulation
        run: |
          python nexus-b2a/run_demo.py

